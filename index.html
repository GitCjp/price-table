<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="算账表">
<meta name="theme-color" content="#5b7fb8">
<title>商品金额计算表</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 12px; background: #f4f6fa; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .toolbar { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  button { border: none; border-radius: 6px; padding: 8px 10px; font-size: 14px; white-space: nowrap; cursor: pointer; }
  .primary { background: #5b7fb8; color: #fff; }
  .plain { background: #e3e7ef; color: #333; }
  .del { background: transparent; color: #c0392b; padding: 6px 10px; font-size: 20px; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th { background: #5b7fb8; color: #fff; padding: 10px 4px; font-size: 14px; white-space: nowrap; }
  td { border: 1px solid #dde2ea; padding: 0; text-align: center; }
  td.idx { width: 44px; color: #555; }
  td input { width: 100%; box-sizing: border-box; border: none; padding: 10px 6px;
             font-size: 16px; text-align: center; background: transparent; }
  td input:focus { outline: 2px solid #5b7fb8; background: #eef3fb; }
  td input.num { text-align: right; }
  td.amount { text-align: right; padding: 10px 8px; color: #222; }
  tfoot td { white-space: nowrap; position: sticky; bottom: 0; font-weight: bold; padding: 12px 8px; background: #f0f3f8; font-size: 16px; }
  body { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  select { font-size: 16px; padding: 7px 8px; border-radius: 6px; border: 1px solid #c5ccd8;
           background: #fff; max-width: 100%; flex: 1 1 90px; min-width: 0; }
  .danger { color: #c0392b; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 8;
           align-items: flex-start; justify-content: center; padding: 20px 10px; }
  #modal .box { background: #fff; border-radius: 10px; padding: 14px; width: 100%; max-width: 520px; }
  #modal h2 { font-size: 17px; margin: 0 0 8px; }
  #modal ol { margin: 0 0 10px; padding-left: 20px; font-size: 14px; line-height: 1.7; color: #444; }
  #modal textarea { width: 100%; box-sizing: border-box; height: 200px; font-size: 16px;
           border: 1px solid #c5ccd8; border-radius: 6px; padding: 8px; }
  #parseInfo { font-size: 14px; color: #5b7fb8; margin: 6px 0; min-height: 20px; }
  #toast { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); background: rgba(0,0,0,.8);
           color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 15px; display: none; z-index: 9; }
</style>
</head>
<body>
<h1>商品金额计算表</h1>
<div class="toolbar">
  <select id="tableSel"></select>
  <button class="primary" id="newBtn">+ 新建</button>
  <button class="plain" id="renameBtn">改名</button>
  <button class="plain danger" id="delTableBtn">删除</button>
</div>
<div class="toolbar">
  <button class="primary" id="addBtn">+ 添加一行</button>
  <button class="plain" id="exportBtn">导出 Excel</button>
  <button class="plain" id="copyBtn">复制文字</button>
  <button class="primary" id="importBtn">豆包导入</button>
  <button class="plain" id="clearBtn">清空本表</button>
</div>
<div id="toast"></div>
<div id="modal"><div class="box">
  <h2>豆包识别导入</h2>
  <ol>
    <li>点下面"复制提示语"，打开豆包，发照片，再粘贴这句话发送。</li>
    <li>豆包回复后，长按复制它列出的内容。</li>
    <li>回到这里，粘贴到下面的框里，点导入。</li>
  </ol>
  <button class="plain" id="copyPromptBtn">复制提示语</button>
  <textarea id="importText" placeholder="粘贴到这里，例如：&#10;炫赫门 2 172&#10;上风 2 112"></textarea>
  <div id="parseInfo"></div>
  <div class="toolbar">
    <button class="primary" id="importNewBtn">导入为新表格</button>
    <button class="plain" id="importAppendBtn">加到本表后面</button>
    <button class="plain" id="importCancelBtn">取消</button>
  </div>
</div></div>

<table>
  <thead>
    <tr><th>序号</th><th>名称</th><th>数量</th><th>单价(元)</th><th>金额(元)</th><th></th></tr>
  </thead>
  <tbody id="body"></tbody>
  <tfoot>
    <tr><td>合计</td><td></td><td id="totalQty">0</td><td></td><td id="totalAmt">0.00</td><td></td></tr>
  </tfoot>
</table>
<script>
const KEY = 'price-table-rows';
const SAMPLE = [['炫赫门',2,172],['上风',2,112],['颜悦',2,175],['黄山',2,76],['利群',2,164],
  ['荷花',1,293],['芙蓉王',2,202],['蓝楼',2,160],['硬江河',2,77],['乐途',2,122],['紫钻',2,57],
  ['玉溪',2,185],['迎宾',4,63],['紫云',4,113],['红钻',4,58],['纯净',2,168],['白将',2,120],
  ['云龙',4,127],['玫瑰二代',2,93],['白塔',4,85],['小目标',2,122],['绿钻',2,115],['江山',2,95],
  ['黄山',2,75],['大云',2,191]].map(([name, qty, price]) => ({ name, qty: String(qty), price: String(price) }));

// 多个表格存在一起：{ current: id, tables: [{ id, name, rows }] }
const STORE = 'price-table-v2';
const blankRows = () => [{ name: '', qty: '', price: '' }];
const today = () => { const d = new Date(); return `${d.getMonth() + 1}月${d.getDate()}日`; };
let db = JSON.parse(localStorage.getItem(STORE) || 'null');
if (!db) {
  // 第一次用新版：把旧版里已经填的数据搬成"表格1"，不会丢
  const old = JSON.parse(localStorage.getItem(KEY) || 'null');
  db = { current: 't1', tables: [{ id: 't1', name: '表格1', rows: old || SAMPLE }] };
  localStorage.setItem(STORE, JSON.stringify(db));
}
const cur = () => db.tables.find(t => t.id === db.current) || db.tables[0];
let rows = cur().rows;
const body = document.getElementById('body');

// 按“分”计算，避免 0.1+0.2 这类小数误差
const toNum = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const amountCents = r => Math.round(toNum(r.qty) * toNum(r.price) * 100);
const fmt = cents => (cents / 100).toFixed(2);

function save() { cur().rows = rows; localStorage.setItem(STORE, JSON.stringify(db)); }

function updateTotals() {
  let qty = 0, cents = 0;
  rows.forEach((r, i) => {
    qty += toNum(r.qty);
    cents += amountCents(r);
    body.children[i].querySelector('.amount').textContent = fmt(amountCents(r));
  });
  document.getElementById('totalQty').textContent = Math.round(qty * 100) / 100;
  document.getElementById('totalAmt').textContent = fmt(cents);
}

function render() {
  body.innerHTML = '';
  rows.forEach((r, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="idx">${i + 1}</td>
      <td><input data-k="name" placeholder="名称"></td>
      <td><input data-k="qty" class="num" inputmode="decimal" placeholder="0"></td>
      <td><input data-k="price" class="num" inputmode="decimal" placeholder="0.00"></td>
      <td class="amount"></td>
      <td><button class="del" title="删除这一行">×</button></td>`;
    tr.querySelectorAll('input').forEach(inp => {
      inp.value = r[inp.dataset.k];
      inp.addEventListener('input', () => { r[inp.dataset.k] = inp.value; updateTotals(); save(); });
    });
    tr.querySelector('.del').addEventListener('click', () => { rows.splice(i, 1); render(); save(); });
    body.appendChild(tr);
  });
  updateTotals();
}

const $ = id => document.getElementById(id);
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 1800); }

function renderTables() {
  const sel = $('tableSel'); sel.innerHTML = '';
  db.tables.forEach(t => { const o = document.createElement('option');
    o.value = t.id; o.textContent = t.name; sel.appendChild(o); });
  sel.value = cur().id;
}
function switchTo(id) { db.current = id; rows = cur().rows; save(); renderTables(); render(); }

$('tableSel').addEventListener('change', e => switchTo(e.target.value));
$('newBtn').addEventListener('click', () => {
  const name = prompt('新表格的名字：', today());
  if (name === null) return;
  const id = 't' + Date.now();
  db.tables.push({ id, name: name.trim() || today(), rows: blankRows() });
  switchTo(id); toast('已新建，原来的表格还在上面的下拉框里');
});
$('renameBtn').addEventListener('click', () => {
  const name = prompt('改成什么名字：', cur().name);
  if (name && name.trim()) { cur().name = name.trim(); save(); renderTables(); }
});
$('delTableBtn').addEventListener('click', () => {
  if (db.tables.length === 1) { toast('至少要留一个表格'); return; }
  if (!confirm(`确定删除"${cur().name}"整张表吗？删了找不回来。`)) return;
  db.tables = db.tables.filter(t => t.id !== db.current);
  switchTo(db.tables[0].id);
});
$('addBtn').addEventListener('click', () => {
  rows.push({ name: '', qty: '', price: '' });
  render(); save();
  body.lastElementChild.querySelector('input').focus();
});
$('clearBtn').addEventListener('click', () => {
  if (confirm(`确定清空"${cur().name}"里的所有数据吗？`)) { rows = blankRows(); save(); render(); }
});
// ---------- 导出 ----------
const filled = () => rows.filter(r => r.name || r.qty || r.price);
function totals() { let q = 0, c = 0; filled().forEach(r => { q += toNum(r.qty); c += amountCents(r); });
  return { qty: Math.round(q * 100) / 100, amt: fmt(c) }; }

$('exportBtn').addEventListener('click', async () => {
  const cell = v => '"' + String(v).replace(/"/g, '""') + '"';
  const lines = [['序号', '名称', '数量', '单价(元)', '金额(元)']];
  filled().forEach((r, i) => lines.push([i + 1, r.name, r.qty, fmt(Math.round(toNum(r.price) * 100)), fmt(amountCents(r))]));
  const t = totals(); lines.push(['合计', '', t.qty, '', t.amt]);
  const csv = '\uFEFF' + lines.map(l => l.map(cell).join(',')).join('\r\n');  // BOM 让 Excel 认出中文
  const fname = (cur().name.replace(/[\\/:*?"<>|]/g, '_') || '表格') + '.csv';
  const file = new File([csv], fname, { type: 'text/csv' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: cur().name }); } catch (e) { /* 用户取消 */ }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
});

$('copyBtn').addEventListener('click', async () => {
  const t = totals();
  const text = [cur().name, ...filled().map((r, i) =>
      `${i + 1}. ${r.name}  ${r.qty} × ${r.price} = ${fmt(amountCents(r))}`),
    `合计：数量 ${t.qty}，金额 ${t.amt} 元`].join('\n');
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('已复制，可以去微信粘贴');
});

// ---------- 拍照识别导入（豆包识别 → 粘贴） ----------
const AI_PROMPT = '请识别这张照片里的手写清单。每一条输出一行，格式是：名称 数量 单价，中间用空格隔开。' +
  '不要表头、不要序号、不要合计、不要其他说明文字。看不清的字后面加一个问号。';

// 每行找出：名称（带汉字/字母的部分）+ 后面的前两个数字（数量、单价）
function parseLines(text) {
  const out = [];
  text.split(/\r?\n/).forEach(line => {
    line = line.replace(/[|｜\t,，、：:×xX*＊=]/g, ' ').replace(/[元块¥￥]/g, ' ')
               .replace(/(\d)\s*(条|包|盒|个|件|瓶|箱|支|袋)/g, '$1 ')
               .replace(/[０-９．]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).trim();
    if (!line || /名称|数量|单价|合计|总计|^-+$/.test(line.replace(/\s|-/g, '') || '-')) return;
    const tokens = line.split(/\s+/).filter(t => t && !/^-+$/.test(t));
    const isNum = t => /^\d+(\.\d+)?$/.test(t);
    let i = 0;
    while (i < tokens.length && isNum(tokens[i])) i++;          // 跳过行首序号
    const nameParts = [];
    while (i < tokens.length && !isNum(tokens[i])) nameParts.push(tokens[i++]);
    const nums = tokens.slice(i).filter(isNum);
    const name = nameParts.join('').replace(/^\d+[.、)）]/, '');
    if (name && nums.length >= 1) out.push({ name, qty: nums[0], price: nums[1] || '' });
  });
  return out;
}

const modal = $('modal');
$('importBtn').addEventListener('click', () => { modal.style.display = 'flex'; $('importText').focus(); });
$('importCancelBtn').addEventListener('click', () => { modal.style.display = 'none'; });
$('copyPromptBtn').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(AI_PROMPT); toast('已复制，去豆包粘贴'); }
  catch (e) { prompt('长按复制这段话：', AI_PROMPT); }
});
$('importText').addEventListener('input', () => {
  const n = parseLines($('importText').value).length;
  $('parseInfo').textContent = n ? `识别到 ${n} 条，导入后可以逐格检查修改` : '';
});
function doImport(asNew) {
  const items = parseLines($('importText').value);
  if (!items.length) { toast('没认出内容，格式应为：名称 数量 单价'); return; }
  if (asNew) {
    const id = 't' + Date.now();
    db.tables.push({ id, name: today() + '（导入）', rows: items });
    switchTo(id);
  } else {
    rows = rows.filter(r => r.name || r.qty || r.price).concat(items); save(); render();
  }
  $('importText').value = ''; $('parseInfo').textContent = ''; modal.style.display = 'none';
  toast(`已导入 ${items.length} 条，带"？"的请核对`);
}
$('importNewBtn').addEventListener('click', () => doImport(true));
$('importAppendBtn').addEventListener('click', () => doImport(false));

renderTables();
render();
</script>
</body>
</html>
